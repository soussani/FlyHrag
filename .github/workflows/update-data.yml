name: Update public aviation data
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      airports:
        description: Refresh worldwide airports and time zones too
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: flyhrag-public-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Update public weather snapshot
        run: npm run data:weather
      - name: Refresh airport directory when requested
        if: inputs.airports == true
        run: npm run data:airports
      - name: Commit validated public snapshots only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/airports.json public/data/airports-meta.json public/data/weather.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public aviation snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  publish:
    needs: update
    uses: ./.github/workflows/deploy.yml
